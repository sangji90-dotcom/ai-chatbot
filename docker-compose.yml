# 개발/스테이징용. SQLite 를 볼륨에 두고 돌린다.
# 운영 전환 시 db 서비스를 MySQL 로 바꾸고 backend 의 DB_PATH 를 DSN 으로 교체할 것.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_PATH: /data/chatbot.db
      UPLOAD_DIR: /data/images
      RUN_SCHEDULER: "0"     # 스케줄러는 아래 전용 서비스에서만
    volumes:
      - stellia-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  scheduler:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_PATH: /data/chatbot.db
      UPLOAD_DIR: /data/images
      RUN_SCHEDULER: "1"     # 토큰 만료 잡이 중복 실행되지 않도록 이 컨테이너 하나만
    volumes:
      - stellia-data:/data
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    restart: unless-stopped

volumes:
  stellia-data:
